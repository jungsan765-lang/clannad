# 캐릭터 비서 기본 설정.
# 바꾸고 싶은 값은 같은 이름으로 config.local.toml 에 적으면 이 파일보다 우선한다 (git에 안 올라감).
# API 키는 여기 쓰지 않는다: 환경 변수 ANTHROPIC_API_KEY 또는 Windows 자격 증명 관리자(keyring).

[character]
folder = "character/danika_still"          # manifest.json 이 있는 폴더 (make_still.py / make_rig.py 결과). 없으면 임시 원형 캐릭터
persona = "character/danika/persona.md"   # 성격 파일. 없으면 기본 비서 말투
scale = 0.8                               # 화면에 보이는 크기 배율 (768px 그림 → 약 614px)
max_fps = 30
talk_motion = true                        # 말할 때 움직임(말풍선이 떠 있는 동안). false 면 숨쉬기만
always_on_top = true                      # 모든 창(작업 표시줄·창모드 게임 포함)보다 앞에
topmost_interval_ms = 1500                # 맨 앞으로 다시 올리는 간격

[ai]
chat_model = "claude-opus-5-5"     # 대화
memory_model = "claude-opus-5-5"   # 장기기억 정리 (하루 몇 번뿐)
effort = "low"                     # 생각 깊이: low | medium | high
max_tokens = 2000                  # 생각 토큰 포함 상한. 요금은 실제로 쓴 만큼만 나간다
history_turns = 10                 # 대화할 때 함께 보내는 최근 대화 수
timeout_seconds = 60

[screen]
enabled = true                       # 정해진 간격마다 화면 보기 (메뉴·F9 로도 켜고 끔)
interval_seconds = 30                # 화면 확인 간격(초)
monitor = "left"                     # 볼 모니터: left | right | primary | 번호(1, 2 …)
judge_model = "claude-haiku-5-5"     # 말 걸지 판단 (싸고 빠름)
line_model = "claude-opus-5-5"       # 말하기로 했을 때 캐릭터 말투로 한마디
cooldown_seconds = 120               # 먼저 말을 건 뒤 다음 말까지 최소 간격(초)
change_threshold = 0.015             # 화면 변화가 이보다 작으면 판단 없이 건너뜀(비용 0)
max_width = 1024                     # 보내는 스크린샷 가로 크기
jpeg_quality = 70
stop_when_over_budget = true         # 월 예산을 넘으면 화면 보기만 멈춤 (대화는 계속)

[voice]
mode = "off"            # always(항상 듣기) | push(단축키·메뉴로 그때만 듣기) | off(듣지 않기). 메뉴에서도 바꿈
model = "medium"        # 음성 인식 모델: small | medium | large-v3-turbo (클수록 한국어가 정확하고 느림). 처음 쓸 때 한 번 다운로드
device = "cpu"          # cpu | cuda (그래픽카드)
wake_word = ""          # 비우면 들은 말 전부에 반응. 예: "다니카" → 이름을 불렀을 때만

[hotkeys]               # 등록한 키는 다른 프로그램(게임)으로 전달되지 않음. 겹치면 바꾸기. 비우면 안 씀
ask_screen = "F8"       # 지금 화면 보고 말하기
toggle_screen = "F9"    # 화면 보기 켜기/끄기
voice = "F7"            # (단축키 모드) 듣기 시작/끝

[memory]
consolidate_every = 20   # 대화가 이만큼 쌓이면 장기기억을 정리한다
max_chars = 4000         # 장기기억 길이 상한(글자 수)

[budget]
monthly_krw = 50000      # 월 예산
warn_ratio = 0.8         # 이 비율을 넘으면 경고
krw_per_usd = 1400       # 환율 (원/달러). 실제 환율에 맞게 바꾸면 된다

[ui]
bubble_min_seconds = 4.0       # 말풍선 최소 표시 시간
bubble_seconds_per_char = 0.12 # 글자 수에 비례해 더 오래 보여줌
bubble_max_width = 320
