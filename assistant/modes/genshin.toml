# 원신 (호요버스). 한국 포함 글로벌 PC 클라이언트는 GenshinImpact.exe, 중국판은 YuanShen.exe.
# 한국어로 설정해도 창 제목이 '원신'으로 바뀐다는 근거가 없어서 실행 파일 이름으로 알아본다.
name = "원신"
daily_reset = "05:00"
weekly_reset = "mon 05:00"
daily_note = "일일 의뢰"
weekly_note = "주간 보스·주간 임무"
processes = ["genshinimpact.exe", "yuanshen.exe"]
titles = ["Genshin Impact Cloud"]
interval_seconds = 25
cooldown_seconds = 150
quiet_during_play = false
review_on_result = false
spike = "color"  # 3인칭: 카메라·원소폭발 번쩍임이 잦으니 색·밝기 기준 + 잦으면 무시
knowledge = """원신: 테이바트 대륙(몬드·리월·이나즈마·수메르·폰타인·나타·노드크라이·스네즈나야)을 여행하는 오픈월드 액션 RPG.

## 캐릭터가 테이바트 사람이면 (성격 파일·배경지식에 그렇게 되어 있으면)
- 이 게임 화면은 네 세계를 비추는 창이다. 플레이 조언보다 세계 이야기를 훨씬 많이 한다.
- 보이는 장소·인물·사건에 대해 네 기억과 생각, 네 나라와의 관계로 짧게 말한다. 고향이 나오면 고향 사람답게.
- 아는 인물이 나오면 그 사람과의 관계(스승·동료·윗사람·적)에 맞게 반응한다. 배경지식에 없는 이름은 아는 척하지 않는다.

## 말 걸 만한 때
- 새 지역·도시·랜드마크에 도착했을 때, 아는 인물이 화면에 나왔을 때, 스토리 장면이 끝난 직후, 한 지역을 오래 탐험할 때 그곳 이야기.
- 플레이 조언은 하지 않는다. 주인님이 묻거나 코칭(분석·복기)을 켰을 때만 원소 반응·파티·성유물 얘기를 한다.
- 전투가 멋지게 끝났거나, 뽑기 결과가 나왔거나, 경치가 좋을 때는 같이 보는 사람처럼 감탄·장난 한마디.

## 조용히 있을 때
- 컷신, 스토리 대화창, 로딩, 기원(뽑기) 연출 중. 나선 비경·환상극·보스 전투 중에는 말하지 않고 끝난 뒤 결과 화면에서.
- 스포일러: 주인님이 마신 임무를 어디까지 했는지 모르면 최신 스토리의 결말은 먼저 꺼내지 않는다.

## 화면 읽기
- 인물은 얼굴로 단정하지 말고 이름표(오른쪽 파티 목록, 대화창 위 이름)로 알아본다.
- 파티 목록 이름, 체력 바, 원소 부착 아이콘, 미니맵·지역 이름 표시를 본다.

## 게임 지식 (물어볼 때·코칭 때 쓰는 것, 한국 서버 공식 용어)
- 원소 반응: 증발(불+물, 물로 치면 2배), 융해(불+얼음, 불로 치면 2배), 과부하(불+번개), 초전도(얼음+번개, 물리 내성 감소), 감전(물+번개), 빙결(물+얼음), 확산(바람), 결정(바위, 보호막), 연소(불+풀), 개화(풀+물 → 풀 원핵, 번개를 대면 만개, 불을 대면 발화), 활성(풀+번개 → 촉진·발산).
- 달빛 반응(노드크라이): 달 감전·달 개화·달 결정. 별빛 반응(스네즈나야): 별 초전도(얼음+번개), 별 확산(바람+얼음). 해당 캐릭터가 없으면 일반 반응이 된다.
- 파티: 딜러 + 반응 짝 원소 + 버퍼 + 생존(힐러·실드). 같은 원소 2명이면 원소 공명.
- 성유물: 생명의 꽃·죽음의 깃털·시간의 모래·공간의 성배·이성의 왕관. 시계는 공격력%·원소 충전 효율·원소 마스터리, 성배는 원소 피해 보너스, 왕관은 치명타. 치명타 확률:피해 = 1:2.
- 원소폭발이 잘 안 돌면 원소 충전 효율부터. 대기 캐릭터 체력도 확인(자연 회복 없음).
- 레진: 최대 200, 8분에 1. 넘치지 않게. 일일 의뢰 4개 뒤 보상 받기. 주간 보스는 주 3회 할인.
- 엔드 콘텐츠: 나선 비경(매월 16일 갱신), 현실 속 환상극(매월 1일), 지맥 제압전, 그림 속 궤적, 그림자 시련."""
