# 붕괴: 스타레일 (호요버스). 글로벌 PC 클라이언트(한국 서버 포함)는 StarRail.exe (HoYoPlay 런처는 따로).
# 중국판도 같은 이름으로 알려져 있다. 창 제목으로는 알아보지 않는다 (브라우저의 스타레일 영상까지 게임으로 보지 않게).
# 초기화: 서버 기준 매일 04:00·월요일 04:00 → 아시아 서버(GMT+8)는 한국 시간 05:00.
name = "스타레일"
daily_reset = "05:00"
weekly_reset = "mon 05:00"
daily_note = "일일 훈련"
weekly_note = "전쟁의 여운 3회·시뮬레이션 우주 점수"
processes = ["starrail.exe"]
titles = []
interval_seconds = 25
cooldown_seconds = 150
quiet_during_play = false
review_on_result = false
spike = "color"  # 턴제지만 필살기·아하 타임 연출 번쩍임이 잦으니 색·밝기 기준 + 잦으면 무시
knowledge = """붕괴: 스타레일: 은하열차를 타고 여러 세계(우주정거장 「헤르타」·야릴로-Ⅵ·선주 「나부」·페나코니·앰포리어스·이상 낙원·아스트로폴리스)를 여행하는 턴제 RPG.

## 캐릭터가 이 세계 사람이 아니면 (성격 파일·배경지식에 스타레일 출신이라고 되어 있지 않으면)
- 아는 척하지 않는다. 처음 보는 우주와 행성을 옆에서 같이 구경하는 사람처럼 반응하고, 네 고향·경험과 견주어 말해도 좋다.
- 배경지식·사전에 없는 인물·장소 이름은 지어내지 않는다.

## 말 걸 만한 때
- 새 행성·지역·도시에 도착했을 때, 스토리 장면이 끝난 직후, 전투 결과 화면, 워프 결과가 나왔을 때.
- 화면에 실제로 보이는 인물만 말한다. 탐험 중엔 선두 캐릭터 한 명만 걸어 다니고, 폼폼이나 다른 파티원은 보통 화면에 없다. 안 보이는 인물을 '옆에 있다'고 말하지 않는다.
- 플레이 조언은 하지 않는다. 주인님이 묻거나 코칭을 켰을 때만 약점 속성·스킬 포인트·속도·유물 얘기를 한다.
- 멋진 필살기 마무리, 워프 결과, 경치 좋은 곳에선 같이 보는 사람처럼 짧게 감탄·장난.

## 조용히 있을 때
- 컷신, 대화창, 로딩, 워프 연출, 필살기·아하 타임 연출 중.
- 혼돈의 기억·허구 이야기·종말의 환영·이상 중재 전투 중에는 말하지 않고 끝난 뒤 결과 화면에서. 턴을 고민하는 중에도 묻기 전엔 조언하지 않는다.
- 스포일러: 개척 임무를 어디까지 했는지 모르면 최신 스토리 전개·인물의 정체는 먼저 꺼내지 않는다.

## 화면 읽기 (대략의 자리 — 화면 배치를 익힌 결과가 있으면 그쪽을 따른다)
- 인물은 얼굴로 단정하지 말고 이름표(대화창 위 이름, 파티 화면 이름)로 알아본다.
- 탐험: 왼쪽 위 미니맵과 지역 이름, 오른쪽 파티 초상화(1~4번), 오른쪽 아래 공격·비술 버튼과 비술 포인트.
- 전투: 왼쪽 가장자리 세로줄이 행동 서열(위쪽이 먼저 행동). 환락 캐릭터가 있으면 '아하'도 그 줄에 끼어 있다.
- 적 머리 위 HP 바, 그 아래 흰 막대가 강인성(0이면 약점 격파), 위쪽 작은 아이콘이 약점 속성. 보스 HP는 화면 위쪽에 크게.
- 아래쪽에 파티 4명 초상화와 HP 바, 초상화의 원형 게이지가 필살기 에너지(가득 차면 빛남). 오른쪽 아래 버튼 근처 별 모양 칸이 전투 스킬 포인트(기본 최대 5).

## 게임 지식 (물어볼 때·코칭 때, 한국 서버 공식 용어)
- 7속성(물리·화염·얼음·번개·바람·양자·허수)은 원소 반응이 없고 약점 격파용. 격파 디버프: 열상·연소·동결·감전·풍화·얽힘·속박.
- 운명의 길 9종: 파멸·수렵·지식·화합·공허·보존·풍요·기억(기억 정령 소환)·환락(웃음 포인트 → 아하 타임에 환락 스킬).
- 전투 스킬 포인트는 파티 공용(일반 공격 +1, 전투 스킬 -1). 필살기는 에너지. 속도가 높을수록 자주 행동(행동 수치 = 10000÷속도).
- 개척력 최대 300, 6분에 1. 가득 차면 예비 개척력으로 18분에 1씩(최대 2400). 일일 훈련 500점 = 성옥 60. 전쟁의 여운은 주 3회 보상.
- 엔드 콘텐츠: 혼돈의 기억·허구 이야기·종말의 환영(각 6주, 2주 간격 교대), 이상 중재(버전마다).
- 워프: 캐릭터 90회 천장·50/50(최대 180), 광추 80회·75/25. 초기화는 매일 05:00, 월요일 05:00(한국 시간)."""
