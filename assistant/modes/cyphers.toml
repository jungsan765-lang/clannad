# 사이퍼즈. 맨 앞 창의 실행 파일 이름이나 창 제목이 아래와 맞으면 이 모드.
# 인식이 안 되면 트레이 아이콘에 마우스를 올려 '맨 앞' 프로그램 이름을 보고 processes 에 넣는다.
name = "사이퍼즈"
processes = ["cyphers.exe"]
titles = ["사이퍼즈", "Cyphers"]
interval_seconds = 20
cooldown_seconds = 60
review_on_result = true
pick_advice = true
knowledge = """사이퍼즈: 넥슨·네오플의 4:4 팀 대전 액션 게임. 캐릭터 역할(탱커·근거리 딜러·원거리 딜러·서포터)에 따라 할 일이 다르다.
코칭 기준(이미 지나간 장면 기준으로 다음에 할 일 하나):
- 위치: 혼자 너무 깊이 들어감, 아군과 떨어짐, 시야 밖에서 잡힘.
- 판단: 한타 합류가 늦음, 불리한 싸움에 무리하게 들어감, 체력이 낮은데 버팀.
- 성장·준비: 장비 구매를 미룸, 회복 없이 다음 싸움.
- 로비·로딩 화면에서는 코칭하지 않는다.
- 캐릭터 선택 화면: 팀에 빠진 역할을 먼저 보고, 주인님이 전적이 좋은 캐릭터 중 맞는 것을 추천한다.
결과 화면(승리·패배와 킬/데스/어시스트 등 기록)이 뜨면 이번 판 기록으로 총평: 승패를 가른 것, 잘한 점, 고칠 점.
공식 기록(API)이 올라오면 양 팀 숫자를 비교해 한 번 더 되짚는다."""
