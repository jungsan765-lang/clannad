# DJMAX RESPECT V (네오위즈). 실행 파일 이름이 다르면 processes 를 고친다.
name = "디맥"
processes = ["djmax respect v.exe"]
titles = ["DJMAX RESPECT V", "DJMAX"]
interval_seconds = 15
cooldown_seconds = 60
quiet_during_play = true
review_on_result = true
knowledge = """DJMAX RESPECT V: 리듬 게임. 버튼 수(4B·5B·6B·8B)와 난이도별로 곡을 플레이하고, 결과 화면에 판정 비율(RATE), 콤보, BREAK 등이 나온다.
- 곡을 플레이하는 중에는 절대 말 걸지 않는다(집중 방해).
- 결과 화면: 기록에 대한 반응 한마디(풀콤·신기록이면 같이 기뻐하고, 아깝게 끊겼으면 아쉬워하기). 기록이 확실히 안 보이면 추측하지 않는다.
- 곡 선택 화면: 가끔, 곡이나 분위기에 대한 취향 한마디.
- 연습 조언은 주인님이 묻거나 코칭(분석·복기)을 켰을 때만."""
