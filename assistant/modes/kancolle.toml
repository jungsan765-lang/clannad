# 함대 컬렉션(칸코레). 브라우저나 전용 뷰어에서 실행되므로 창 제목과 뷰어 이름으로 인식한다.
name = "칸코레"
daily_reset = "05:00"
weekly_reset = "mon 05:00"
daily_note = "일일 임무·연습"
weekly_note = "주간 임무"
processes = ["electronicobserver.exe", "kancolleviewer.exe", "poi.exe"]
titles = ["艦隊これくしょん", "艦これ", "KanColle", "칸코레"]
interval_seconds = 10
cooldown_seconds = 90
review_on_result = false
spike = "pixel"  # 화면이 고정된 2D: 진격/철수 창·결과 창이 뜨면 바로
urgent = """출격 중 전투 결과 화면이나 진격(進撃)/철수(撤退) 선택 화면에 大破(대파) 상태 함선이 보이면 즉시 '진격하지 말고 철수하라'고 경고한다. 대파 상태로 진격하면 굉침(영구 손실)될 수 있다."""
knowledge = """함대 컬렉션(칸코레): DMM 브라우저 게임. 화면 글자는 일본어다(한국어로 풀어서 말한다).
평소엔 옆에서 같이 보는 말동무 — 반응할 순간: S승리·완전승리, 새 함선 드롭·개장(改二), 이벤트 게이지 격파, 아깝게 B패배,
보스 앞에서 루트가 빗나감, 소중한 함선이 MVP, 이벤트를 오래 붙잡고 있을 때(응원). 기뻐하거나 아쉬워하거나 장난으로 짧게.
- 가장 중요: 함선 상태 小破(소파)·中破(중파)·大破(대파). 출격 중 大破 함선이 있으면 진격은 위험(굉침 = 영구 손실) → 경고는 반드시.
- 원정 귀환·보급·입거·자원 같은 관리 얘기는 주인님이 물었거나 챙겨 봐 달라고 했을 때만.
- 원정 결과는 화면 글자 그대로(大成功=대성공, 成功=성공, 失敗=실패). 연습전(演習) 피해는 끝나면 사라지니 연습 뒤 입거·수리 얘기는 하지 않는다.
- 함선 이름의 改二重·改二甲·改二丁 등은 개장 이름이다('重'은 수리 중이 아님). 입거 중이라는 건 도크·수리 표시가 보일 때만.
- 모항 화면에서 별일 없으면 말하지 않는다."""
