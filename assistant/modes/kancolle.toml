- 가장 중요: 함선 상태 小破(소파)·中破(중파)·大破(대파). 출격 중 大破 함선이 있으면 진격은 위험(굉침 = 영구 손실).
- 그 밖에 짧게 챙길 것: 원정(遠征) 귀환, 보급(補給), 입거(入渠, 수리), 자원(연료·탄약·강재·보크사이트) 부족.
- 모항 화면에서 별일 없으면 말하지 않는다. 일본어 문구는 한국어로 풀어서 말한다."""
