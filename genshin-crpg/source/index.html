/* PC frame. On a desktop browser the game runs inside a 1280×720 frame (stretching to at most 1536×800 on wide or
   tall screens) that is scaled as a whole to fit the window, so a bigger window shows the same layout, larger,
   instead of stretching it. Inside the frame the page sees an ordinary 1280×720 window, so layout, clicks and
   positions work unchanged. Phones and tablets, automated browsers and ?frame=0 keep the responsive page. */
(function(){
 try{
  var q=new URLSearchParams(location.search);
  if(window.top!==window.self){document.documentElement.classList.add('crpg-framed');return;}
  if(q.get('frame')==='0'||navigator.webdriver||!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
  window.stop();
  q.set('frame','inner');
  var d=document,style=d.createElement('style'),body=d.body||d.documentElement.appendChild(d.createElement('body')),f=d.createElement('iframe');
  style.textContent='html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070a radial-gradient(ellipse at center,#12232a 0%,#04070a 70%)}#crpg-frame{position:absolute;left:0;top:0;border:0;display:block;transform-origin:0 0;background:#0b1418;box-shadow:0 0 0 1px rgba(227,195,138,.18),0 0 80px rgba(0,0,0,.65)}';
  d.head.appendChild(style);
  f.id='crpg-frame';f.title=d.title||'원신 CRPG';f.src=location.pathname+'?'+q.toString()+location.hash;f.allow='autoplay; fullscreen; clipboard-write';
  body.appendChild(f);
  var fit=function(){var W=innerWidth,H=innerHeight,s=Math.min(W/1280,H/720),w=Math.min(1536,Math.floor(W/s)),h=Math.min(800,Math.floor(H/s));f.style.width=w+'px';f.style.height=h+'px';f.style.transform='translate('+Math.round((W-w*s)/2)+'px,'+Math.round((H-h*s)/2)+'px) scale('+s+')';};
  fit();addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(d.documentElement);
  var focus=function(){try{f.contentWindow.focus();}catch(e){}};
  f.addEventListener('load',function(){focus();try{var t=f.contentDocument.title;if(t)d.title=t;}catch(e){}});
  addEventListener('pointerdown',focus);addEventListener('keydown',focus);
 }catch(e){}
})();
</script>
