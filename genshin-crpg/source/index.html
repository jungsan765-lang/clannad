<script>
/* PC frame. On a desktop browser the game runs inside a frame whose page size follows the window at the chosen
   screen size (설정 → 화면 크기: 작게/보통/크게, 보통 = the browser's own size), but never below 1280×720, never taller
   than 1600 (at 보통; the limit moves with the chosen size, so 작게 and 크게 still differ on very large monitors) and
   never wider than about 2:1. Outside those limits the whole frame is scaled to fit, so very small, very large or
   very wide windows keep the same layout instead of breaking it. Inside the frame the page sees an ordinary window of
   that size, so layout, clicks and positions work unchanged. Phones and tablets, automated browsers and ?frame=0
   keep the responsive page. */
(function(){
 try{
  var q=new URLSearchParams(location.search);
  if(window.top!==window.self){document.documentElement.classList.add('crpg-framed');return;}
  if(q.get('frame')==='0'||navigator.webdriver||!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
  q.set('frame','inner');
  var src=location.pathname+'?'+q.toString()+location.hash;
  window.CRPGFrameHost=function(){
   var d=document,f=d.getElementById('crpg-frame');if(!f)return;
   f.src=src;
   // CSS zoom renders the game at the enlarged size (crisp text); where zoom does not scale the frame and its page
   // together, fall back to transform: scale.
   var mode='zoom',w=1280,h=720,s=1;
   var SIZES={small:.85,large:1.2};
   var size=function(){try{return SIZES[JSON.parse(localStorage.getItem('crpg-preferences-v3')||'{}').uiScale]||1;}catch(e){return 1;}};
   // The page size and scale this window gives a screen size k (also used by the setting to show what each choice does).
   var measure=function(k){var W=innerWidth,H=innerHeight,mh=Math.round(Math.max(720,Math.min(1600/k,H/k))),mw=Math.round(Math.max(1280,Math.min(W/k,mh*1.92)));return {w:mw,h:mh,s:Math.min(W/mw,H/mh)};};
   window.CRPGFrameMeasure=function(name){return measure(SIZES[name]||1);};
   var fit=function(){var W=innerWidth,H=innerHeight,m=measure(size());w=m.w;h=m.h;s=m.s;var x=(W-w*s)/2,y=(H-h*s)/2;f.style.width=w+'px';f.style.height=h+'px';
    if(mode==='zoom'){f.style.transform='';f.style.zoom=String(s);f.style.left=(x/s)+'px';f.style.top=(y/s)+'px';}
    else{f.style.zoom='';f.style.left='0';f.style.top='0';f.style.transform='translate('+Math.round(x)+'px,'+Math.round(y)+'px) scale('+s+')';}};
   var check=function(){if(mode!=='zoom')return;var ok=Math.abs(f.getBoundingClientRect().width-w*s)<3;try{if(f.contentWindow.innerWidth)ok=ok&&Math.abs(f.contentWindow.innerWidth-w)<3;}catch(e){}if(!ok){mode='transform';fit();}};
   window.CRPGFrameFit=function(){fit();check();};
   fit();check();addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(d.documentElement);
   var focus=function(){try{f.contentWindow.focus();}catch(e){}};
   f.addEventListener('load',function(){check();focus();try{var t=f.contentDocument.title;if(t)d.title=t;}catch(e){}});
   addEventListener('pointerdown',focus);addEventListener('keydown',focus);
  };
  // Write the frame, then turn the rest of this file into hidden text (<plaintext>) so the game itself runs only inside
  // the frame. Stopping the parser with window.stop() instead leaves Chrome unable to paint the page (black screen).
  document.write('<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04070a radial-gradient(ellipse at center,#12232a 0%,#04070a 70%)}#crpg-frame{position:absolute;left:0;top:0;border:0;display:block;transform-origin:0 0;background:#0b1418;box-shadow:0 0 0 1px rgba(227,195,138,.18),0 0 80px rgba(0,0,0,.65)}plaintext{display:none!important}</style></head><body><iframe id="crpg-frame" title="'+document.title.replace(/[<>&"]/g,'')+'" allow="autoplay; fullscreen; clipboard-write"></iframe><script>CRPGFrameHost();<\/script><plaintext hidden>');
 }catch(e){}
})();
</script>
