/* 0.16.29 고정 화면 (user: 「그냥 화면을 완전히 고정시켜버려. 이렇게 줄여도 화면 자체가 아예 고정되서 글이 줄었다 늘었다
   하지 않게. 휴대폰도 동일」, shown with KanColle). The game page has exactly one size and runs inside a frame of that size,
   so nothing in it ever moves, wraps or changes size with the window:
    - a computer: 1600×900 (0.16.40; 설정 → 화면 배율 75/100/125/150%, 125% = its own size). A smaller window gets scroll bars around the game,
      like KanColle; a larger one shows it in the middle. The browser's own zoom (Ctrl +/−) still works.
    - an installed phone (or ?display=app): 1280×720 like a tablet (0.16.41; 760×352 before), reduced once to fit the screen
      inside its safe area. The keyboard never shrinks it: the game only slides up so the box being typed in stays above it.
    - a tablet: 1280×720, enlarged or reduced once to fill the screen.
   Inside the frame the page sees an ordinary window of that size, so media queries, units, dialogs and clicks work as on
   any page. A phone browser that is not installed keeps the plain page (the install guide), and so do automated browsers
   and ?frame=0, so tests open the page at exactly 1280×720 or 760×352 to see what every player sees. */
(function(){
 try{
  var q=new URLSearchParams(location.search),de=document.documentElement;
  // Which of the two fixed screens this page is laid out for (screen_v01629.css): the frame says so; a page outside the
  // frame (tests at exactly 760×352 or 1280×720, the phone install guide) goes by its own size.
  var stage=function(){var phone=q.get('stage')?q.get('stage')==='phone':!!(window.matchMedia&&matchMedia('(orientation: landscape) and (max-height: 500px)').matches);de.classList.toggle('stage-phone',phone);de.classList.toggle('stage-pc',!phone);};
  stage();if(!q.get('stage'))addEventListener('resize',stage);
  if(window.top!==window.self){
   de.classList.add('crpg-framed');var st=q.get('stage');if(st==='phone'||st==='pc')de.classList.add('crpg-stage-'+st);
   // How the app was opened and which way the phone is held belong to the window the player holds, not to this fixed frame.
   try{var top=window.top,own=window.matchMedia.bind(window),theirs=top.matchMedia.bind(top);window.matchMedia=function(s){return /display-mode|orientation/.test(String(s))?theirs(s):own(s);};}catch(e){}
   // 0.16.41: a frame drawn by an older release (an update that reloaded only this page kept the phone at 760×352) is
   // reloaded once, so it frames this release at its own size.
   try{if(window.parent.CRPGFrameHost&&window.parent.CRPGFrameRev!==2&&!sessionStorage.getItem('crpg-frame-heal')){sessionStorage.setItem('crpg-frame-heal','1');window.parent.location.reload();}}catch(e){}
   return;
  }
  if(q.get('frame')==='0'||navigator.webdriver)return;
  var mm=function(s){try{return matchMedia(s).matches;}catch(e){return false;}};
  var desk=mm('(hover:hover) and (pointer:fine)'),side=Math.min(screen.width||0,screen.height||0)||Math.min(innerWidth,innerHeight);
  var phone=!desk&&side>0&&side<600,installed=mm('(display-mode: fullscreen)')||mm('(display-mode: standalone)')||navigator.standalone===true||q.get('display')==='app';
  if(phone&&!installed)return;
  // 0.16.40 (user: 「이전엔 완전 PC 느낌이 났는데 왜이렇게 글씨들도 존나 크고 … 여전히 휴대폰으로 하는 느낌」): a computer lays the game
  // out on a 1600×900 page — the letters at a computer's own size with the room around them — instead of 1280×720 drawn
  // 25% larger (every letter and button grew with it, like a phone). A tablet keeps 1280×720.
  // 0.16.41 (user: 「휴대폰도 크기에 맞춰서 가두던가... 칸코레도 그렇게 하고 있잖아」): a phone shows the tablet's 1280×720 page
  // reduced to fit, like KanColle — the same screens as a computer, no separate small-screen layout to cut cards.
  var SW=desk?1600:1280,SH=desk?900:720;
  q.set('frame','inner');q.set('stage','pc');if(phone)q.set('display','app');
  var src=location.pathname+'?'+q.toString()+location.hash;
  window.CRPGFrameRev=2;// 0.16.41: phones framed at 1280×720 (read by the page inside)
  window.CRPGFrameHost=function(){
   var d=document,f=d.getElementById('crpg-frame'),safe=d.getElementById('crpg-safe');if(!f)return;
   f.src=src;f.style.width=SW+'px';f.style.height=SH+'px';
   // CSS zoom draws the enlarged game crisply; where zoom does not enlarge the frame and its page together, transform.
   var mode='zoom',s=1,x=0,y=0,lift=0,room=null;
   // 0.16.39 (user: 「화면 크기는 125%를 기본으로 두자 그게 FHD 크기에 적당한 것 같아. 150%는 QHD 크기에 적당한 느낌」): 75/100/125/150%,
   // and with nothing chosen yet 125% — or the largest that still fits a smaller window, so a laptop gets no scroll bars.
   // The choices keep their sizes on the screen (125% = 1600×900, the size for a full-HD monitor; 150% = 1920×1080 for QHD);
   // the 1600×900 page is drawn at 125%/125 of its size. With nothing chosen: 125%, or exactly what fits a smaller window.
   var ZOOM={'75':.6,'100':.8,'125':1,'150':1.2};
   // Only a computer chooses: a phone or a tablet always fills its screen.
   if(desk)window.CRPGFrameZooms=[['75','75%'],['100','100%'],['125','125%'],['150','150%']];
   var auto=function(){return Math.max(.6,Math.min(1,innerWidth/SW,innerHeight/SH));};
   window.CRPGFrameDefaultZoom=function(){var z=auto();return z>=1?'125':z>=.8?'100':'75';};
   var chosen=function(){try{return ZOOM[JSON.parse(localStorage.getItem('crpg-preferences-v3')||'{}').uiScale]||auto();}catch(e){return auto();}};
   var inset=function(){var c=safe&&getComputedStyle(safe),n=function(v){return parseFloat(v)||0;};return c?{l:n(c.paddingLeft),r:n(c.paddingRight),t:n(c.paddingTop),b:n(c.paddingBottom)}:{l:0,r:0,t:0,b:0};};
   var inner=function(){try{return f.contentDocument;}catch(e){return null;}};
   var typing=function(){var a=inner()&&inner().activeElement;return !!a&&(a.tagName==='TEXTAREA'||a.isContentEditable||a.tagName==='INPUT'&&!/^(checkbox|radio|range|button|submit|reset|color|file|image)$/i.test(a.type||'text'));};
   var place=function(){
    if(mode==='zoom'){f.style.transform='';f.style.zoom=s===1?'':String(s);f.style.left=(x/s)+'px';f.style.top=((y-lift)/s)+'px';}
    else{f.style.zoom='';f.style.left='0';f.style.top='0';f.style.transform='translate('+Math.round(x)+'px,'+Math.round(y-lift)+'px)'+(s===1?'':' scale('+s+')');}};
   var fit=function(){
    var W=innerWidth,H=innerHeight;
    // 0.16.47 (user: 「휴대폰 할때 시작부터 화면이 좀 확 줌인 된 채로 시작되는 버그」): a phone measures what it shows (the visual
    // viewport), not the layout viewport — a frame still too large while the app opens made Chrome widen the page (1164×535 on a
    // 740×340 screen) and the game was fitted to that, drawn larger than the screen.
    var v=window.visualViewport;if(!desk&&v&&v.width>0&&v.height>0){W=Math.min(W,Math.round(v.width*(v.scale||1)));H=Math.min(H,Math.round(v.height*(v.scale||1)));}
    if(desk){s=chosen();x=Math.max(0,Math.round((W-SW*s)/2));y=Math.max(0,Math.round((H-SH*s)/2));lift=0;place();return;}
    var i=inset(),now={x:i.l,y:i.t,w:Math.max(1,W-i.l-i.r),h:Math.max(1,H-i.t-i.b)};
    // The keyboard took the lower part of the screen (same width, less height, a box being typed in): keep the size.
    if(room&&typing()&&now.w===room.w&&now.h<room.h)now=room;else room=now;
    s=Math.min(now.w/SW,now.h/SH);x=now.x+(now.w-SW*s)/2;y=now.y+(now.h-SH*s)/2;lift=0;place();keyboard();};
   // Slide the game up just enough that the box being typed in sits above the keyboard.
   var keyboard=function(){if(desk)return;var v=window.visualViewport,a=inner()&&inner().activeElement;var want=0;
    if(v&&typing()&&a.getBoundingClientRect){var r=a.getBoundingClientRect(),bottom=y+r.bottom*s+8,seen=v.offsetTop+v.height;want=Math.max(0,Math.min(y+SH*s-seen,bottom-seen));}
    if(Math.abs(want-lift)>1){lift=want;place();}};
   var check=function(){if(mode!=='zoom'||s===1)return;var ok=Math.abs(f.getBoundingClientRect().width-SW*s)<3;try{if(f.contentWindow.innerWidth)ok=ok&&Math.abs(f.contentWindow.innerWidth-SW)<3;}catch(e){}if(!ok){mode='transform';place();}};
   window.CRPGFrameFit=function(){fit();check();};
   fit();check();addEventListener('resize',function(){fit();check();});addEventListener('orientationchange',function(){room=null;setTimeout(window.CRPGFrameFit,60);setTimeout(window.CRPGFrameFit,400);});
   if(window.visualViewport){visualViewport.addEventListener('resize',desk?keyboard:function(){if(!typing())fit();check();keyboard();});visualViewport.addEventListener('scroll',keyboard);}
   // An installed app settles its screen (bars, rotation) a moment after it opens: fit again then.
   if(!desk){[150,500,1200,2500].forEach(function(t){setTimeout(window.CRPGFrameFit,t);});addEventListener('pageshow',function(){window.CRPGFrameFit();});}
   var focus=function(){try{f.contentWindow.focus();}catch(e){}};
   f.addEventListener('load',function(){check();focus();var doc=inner();try{var t=doc.title;if(t)d.title=t;}catch(e){}
    try{doc.addEventListener('focusin',function(){setTimeout(keyboard,120);});doc.addEventListener('focusout',function(){setTimeout(function(){if(!typing()){room=null;fit();}},120);});}catch(e){}});
   addEventListener('pointerdown',focus);addEventListener('keydown',focus);
  };
  // Write the frame, then turn the rest of this file into hidden text (<plaintext>) so the game itself runs only inside
  // the frame. Stopping the parser with window.stop() instead leaves Chrome unable to paint the page (black screen).
  // 0.16.47: on a phone the frame is fixed to the screen (it never widens the page) and the page cannot be pinched larger.
  var page=desk?'html,body{margin:0;min-width:100%;min-height:100%;overflow:auto}':'html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}#crpg-frame{position:fixed!important}';
  if(!desk)try{var vp=document.querySelector('meta[name=viewport]');if(vp)vp.setAttribute('content','width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content,viewport-fit=cover');}catch(e){}
  document.write('<style>'+page+'html,body{background:#04070a radial-gradient(ellipse at center,#12232a 0%,#04070a 70%) fixed}#crpg-frame{position:absolute;left:0;top:0;border:0;display:block;transform-origin:0 0;background:#0b1418;box-shadow:0 0 0 1px rgba(227,195,138,.18),0 0 80px rgba(0,0,0,.65)}#crpg-safe{position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}plaintext{display:none!important}</style></head><body><div id="crpg-safe"></div><iframe id="crpg-frame" title="'+document.title.replace(/[<>&"]/g,'')+'" allow="autoplay; fullscreen; clipboard-write; screen-wake-lock"></iframe><script>CRPGFrameHost();<\/script><plaintext hidden>');
 }catch(e){}
})();
