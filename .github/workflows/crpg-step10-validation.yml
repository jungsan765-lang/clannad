name: CRPG Step 10 Validation

on:
  push:
    branches:
      - feat/crpg-step10-liyue-artifacts
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genshin-crpg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: npm ci
      - name: Step 10 Liyue artifact regressions
        run: node tools/test_gameplay_step10_artifacts.cjs
      - name: Preserve step 9 hotfixes
        run: node tools/test_gameplay_step9_hotfix.cjs
      - name: Build production pack
        run: python tools/build.py
      - name: Verify built artifact scripts
        run: |
          test -f dist/runtime_liyue_artifacts.js
          test -f dist/app_liyue_artifacts.js
          grep -q "runtime_liyue_artifacts.js?v=" dist/index.html
          grep -q "app_liyue_artifacts.js?v=" dist/index.html
