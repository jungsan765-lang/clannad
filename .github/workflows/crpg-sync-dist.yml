name: CRPG Verify and Publish Artifact

on:
  pull_request:
    paths:
      - 'genshin-crpg/source/**'
      - 'genshin-crpg/content/**'
      - '!genshin-crpg/content/archive/**'
      - 'genshin-crpg/assets/**'
      - 'genshin-crpg/audio/**'
      - 'genshin-crpg/tools/build.py'
      - 'genshin-crpg/tools/engine_identity.py'
      - 'genshin-crpg/server/protocol.json'
      - 'genshin-crpg/server/compatibility.json'
      - 'genshin-crpg/package.json'
      - 'genshin-crpg/package-lock.json'
      - '.github/workflows/crpg-sync-dist.yml'
  push:
    branches: [main]
    paths:
      - 'genshin-crpg/source/**'
      - 'genshin-crpg/content/**'
      - '!genshin-crpg/content/archive/**'
      - 'genshin-crpg/assets/**'
      - 'genshin-crpg/audio/**'
      - 'genshin-crpg/tools/build.py'
      - 'genshin-crpg/tools/engine_identity.py'
      - 'genshin-crpg/server/protocol.json'
      - 'genshin-crpg/server/compatibility.json'
      - 'genshin-crpg/package.json'
      - 'genshin-crpg/package-lock.json'
      - '.github/workflows/crpg-sync-dist.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish verified artifact (requires matching Worker and Pages source: Actions)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crpg-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            genshin-crpg
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: genshin-crpg/package-lock.json
      - name: Install dependencies
        working-directory: genshin-crpg
        run: |
          python -m pip install pillow
          npm ci
          npx playwright install --with-deps chromium
      - name: Source and authoritative server regression gates
        working-directory: genshin-crpg
        run: npm test
      - name: Source UI against actual Worker and SQLite
        working-directory: genshin-crpg
        run: |
          npm run test:browser
          CRPG_TEST_BACKEND=do npm run test:browser
      - name: Build production pack after source gates pass
        working-directory: genshin-crpg
        run: npm run build
      - name: Verify shipped UI against actual Worker and SQLite
        working-directory: genshin-crpg
        env:
          CRPG_TEST_DIST: '1'
        run: |
          npm run test:browser
          CRPG_TEST_BACKEND=do npm run test:browser
          node -e "const p=require('./package.json'),r=require('./dist/release.json');if(p.version!==r.appVersion)process.exit(1)"
      # Test releases (PRs from test/* or release/* branches of this repository, drafts included): also package the
      # test API server built from the same verified tree, so the Seoul VPS only downloads and swaps files and never
      # builds or tests anything itself.
      - name: Package verified test API server
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'test/') || startsWith(github.head_ref, 'release/'))
        working-directory: genshin-crpg
        run: |
          bash -n tools/install-fixed-region-test-release.sh
          npm run build:server
          mkdir -p ../verified-server/server/generated
          cp server/*.mjs ../verified-server/server/
          cp server/generated/engine.mjs ../verified-server/server/generated/
          cp tools/install-fixed-region-test-release.sh ../verified-server/
          node --input-type=module -e "const m=await import(process.argv[1]);process.stdout.write(m.ENGINE_FINGERPRINT)" "$PWD/server/generated/engine.mjs" >../verified-server/server-engine.txt
          node -e "const fs=require('fs'),a=fs.readFileSync('../verified-server/server-engine.txt','utf8').trim(),b=require('./dist/release.json').engineVersion;if(!a||a!==b){console.error('test API engine '+a+' does not match client pack engine '+b);process.exit(1)}"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'test/') || startsWith(github.head_ref, 'release/'))
        with:
          name: crpg-test-server-${{ github.sha }}
          path: verified-server
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: crpg-production-${{ github.sha }}
          path: genshin-crpg/dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crpg-evidence-${{ github.sha }}
          path: genshin-crpg/evidence
          retention-days: 14


  # Test release for test.clannad.shop: any PR (drafts included) from a test/* or release/* branch of this repository.
  # Builds and tests happen only in the verify job above; this job packages the verified results.
  test-package:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'test/') || startsWith(github.head_ref, 'release/'))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crpg-production-${{ github.sha }}
          path: verified-pack
      - uses: actions/download-artifact@v4
        with:
          name: crpg-test-server-${{ github.sha }}
          path: verified-server
      - name: Mark dedicated Seoul test artifact
        env:
          TEST_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cat >verified-pack/online_config.js <<'EOF'
          window.CRPG_ONLINE_CONFIG={apiBase:'https://test.clannad.shop/api',environment:'seoul-test'};
          (function(){
            function mark(){
              if(document.getElementById('crpg-test-banner')) return;
              const el=document.createElement('div');
              el.id='crpg-test-banner';
              el.textContent='TEST SERVER · 서울 테스트 환경 · 운영 세이브와 분리됨';
              Object.assign(el.style,{position:'fixed',left:'0',right:'0',top:'0',zIndex:'2147483647',padding:'5px 10px',textAlign:'center',font:'700 12px/1.3 system-ui,sans-serif',background:'#7a2e00',color:'#fff',pointerEvents:'none'});
              document.body.appendChild(el);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mark,{once:true});else mark();
          })();
          EOF
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('verified-pack')
          pack=json.loads((root/'offline-pack.json').read_text())
          target=root/'online_config.js'
          data=target.read_bytes()
          for entry in pack['files']:
              if entry['path']=='online_config.js':
                  entry['sha256']=hashlib.sha256(data).hexdigest()
                  entry['bytes']=len(data)
                  break
          else:
              raise SystemExit('online_config.js missing from offline-pack.json')
          (root/'offline-pack.json').write_text(json.dumps(pack,ensure_ascii=False))
          PY
          printf '%s\n' "$TEST_SHA" >verified-pack/test-source-sha.txt
          tar -C verified-pack -czf crpg-test-pack.tar.gz .
          printf '%s\n' "$TEST_SHA" >verified-server/test-source-sha.txt
          cp verified-server/install-fixed-region-test-release.sh install-fixed-region-test-release.sh
          tar -C verified-server -czf crpg-test-server.tar.gz .
          printf '%s\n' "$TEST_SHA" >crpg-test-sha.txt
      - name: Publish replaceable test pack release
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! gh release view crpg-test-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create crpg-test-latest --repo "${{ github.repository }}" --target "$TEST_SHA" --title "CRPG Seoul test latest" --notes "Automated test-only artifact. Not production." --prerelease
          fi
          gh release upload crpg-test-latest crpg-test-pack.tar.gz crpg-test-server.tar.gz install-fixed-region-test-release.sh --repo "${{ github.repository }}" --clobber
          # The commit marker goes last, so the VPS never sees a SHA whose files are not all uploaded yet.
          gh release upload crpg-test-latest crpg-test-sha.txt --repo "${{ github.repository }}" --clobber
          gh release edit crpg-test-latest --repo "${{ github.repository }}" --title "CRPG Seoul test latest" --notes "Automated test-only artifact for $TEST_SHA. Not production."


  pages:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: crpg-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crpg-production-${{ github.sha }}
          path: verified-pack
      - name: Check matching authoritative server before publishing
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 20 \
            -H 'Cache-Control: no-cache' \
            'https://genshin-crpg-online.jungsan765.workers.dev/health' \
            -o "$RUNNER_TEMP/crpg-worker-health.json"
          python3 - <<'PY'
          import json, os
          release=json.load(open('verified-pack/release.json'))
          health=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'crpg-worker-health.json')))
          assert health.get('ok') and health.get('configured') and health.get('engineVersion')==release['engineVersion'], 'Deploy the matching Worker first; client artifact is held.'
          PY
      - name: Stage existing site plus verified game artifact
        run: |
          rm -rf genshin-crpg/dist
          mv verified-pack genshin-crpg/dist
          python3 genshin-crpg/tools/prepare_pages.py "$RUNNER_TEMP/crpg-pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/crpg-pages
      - uses: actions/deploy-pages@v4
        id: deployment
