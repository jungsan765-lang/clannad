name: CRPG Sync Production Dist

on:
  push:
    branches:
      - main
    paths:
      - "genshin-crpg/source/**"
      - "genshin-crpg/content/**"
      - "genshin-crpg/package.json"
      - "genshin-crpg/package-lock.json"
      - "genshin-crpg/tools/build.py"
      - "genshin-crpg/tests/test_quality_fixes_v01335.cjs"
      - "genshin-crpg/tests/test_quality_fixes_v01336.cjs"
      - "genshin-crpg/tests/test_quality_fixes_v01337.cjs"
      - "genshin-crpg/tests/test_quality_fixes_v01338.cjs"
      - ".github/workflows/crpg-sync-dist.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crpg-production-dist
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build dependency
        run: python -m pip install pillow
      - name: Quality fixes regression
        working-directory: genshin-crpg
        run: node tests/test_quality_fixes_v01335.cjs
      - name: Quality fixes v0.13.36 regression
        working-directory: genshin-crpg
        run: node tests/test_quality_fixes_v01336.cjs
      - name: Quality fixes v0.13.37 regression
        working-directory: genshin-crpg
        run: node tests/test_quality_fixes_v01337.cjs
      - name: Quality fixes v0.13.38 regression
        working-directory: genshin-crpg
        run: node tests/test_quality_fixes_v01338.cjs
      - name: Build production static pack
        working-directory: genshin-crpg
        run: python tools/build.py
      - name: Verify current release
        working-directory: genshin-crpg
        run: |
          node -e "const p=require('./package.json'),r=require('./dist/release.json'); if(r.appVersion!==p.version){console.error(r,p);process.exit(1)}"
          grep -q "runtime_liyue_artifacts.js?v=" dist/index.html
          grep -q "runtime_liyue_encounters.js?v=" dist/index.html
          test -f dist/runtime_liyue_artifacts.js
          test -f dist/runtime_liyue_encounters.js
          if [ "$(node -p "require('./package.json').version")" = "0.13.31" ]; then
            test -f dist/runtime_liyue_equipment.js
            test -f dist/app_liyue_equipment.js
            grep -q "runtime_liyue_equipment.js?v=" dist/index.html
            grep -q "app_liyue_equipment.js?v=" dist/index.html
          fi
      - name: Commit built deployment pack
        run: |
          git config user.name "crpg-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add genshin-crpg/dist genshin-crpg/reports/build.json
          if git diff --cached --quiet; then
            echo "Production dist already current."
            exit 0
          fi
          VERSION="$(node -p "require('./genshin-crpg/package.json').version")"
          git commit -m "build(crpg): sync production dist v${VERSION}"
          git push origin HEAD:main
