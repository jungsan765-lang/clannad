name: CRPG Verify and Publish Artifact

on:
  pull_request:
    paths: ['genshin-crpg/**', '.github/workflows/crpg-sync-dist.yml']
  push:
    branches: [main]
    paths: ['genshin-crpg/**', '.github/workflows/crpg-sync-dist.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish verified artifact (requires matching Worker and Pages source: Actions)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crpg-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            genshin-crpg
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: genshin-crpg/package-lock.json
      - name: Install dependencies
        working-directory: genshin-crpg
        run: |
          python -m pip install pillow
          npm ci
          npx playwright install --with-deps chromium
      - name: Source and authoritative server regression gates
        working-directory: genshin-crpg
        run: npm test
      - name: Source UI against actual Worker and SQLite
        working-directory: genshin-crpg
        run: npm run test:browser
      - name: Build production pack after source gates pass
        working-directory: genshin-crpg
        run: npm run build
      - name: Verify shipped UI against actual Worker and SQLite
        working-directory: genshin-crpg
        env:
          CRPG_TEST_DIST: '1'
        run: |
          npm run test:browser
          node -e "const p=require('./package.json'),r=require('./dist/release.json');if(p.version!==r.appVersion)process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: crpg-production-${{ github.sha }}
          path: genshin-crpg/dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crpg-evidence-${{ github.sha }}
          path: genshin-crpg/evidence
          retention-days: 14

  pages:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: crpg-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: crpg-production-${{ github.sha }}
          path: verified-pack
      - name: Check matching authoritative server before publishing
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 20 \
            -H 'Cache-Control: no-cache' \
            'https://genshin-crpg-online.jungsan765.workers.dev/health' \
            -o "$RUNNER_TEMP/crpg-worker-health.json"
          python3 - <<'PY'
          import json, os
          release=json.load(open('verified-pack/release.json'))
          health=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'crpg-worker-health.json')))
          assert health.get('ok') and health.get('configured') and health.get('engineVersion')==release['engineVersion'], 'Deploy the matching Worker first; client artifact is held.'
          PY
      - name: Stage existing site plus verified game artifact
        run: |
          rm -rf genshin-crpg/dist
          mv verified-pack genshin-crpg/dist
          python3 genshin-crpg/tools/prepare_pages.py "$RUNNER_TEMP/crpg-pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/crpg-pages
      - uses: actions/deploy-pages@v4
        id: deployment
