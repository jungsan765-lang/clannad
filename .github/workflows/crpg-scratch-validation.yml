name: CRPG scratch validation

on:
  push:
    branches:
      - qa/crpg-v01327-market-regression

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genshin-crpg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python -m pip install pillow
      - name: Build source to dist
        run: python3 tools/build.py
      - name: Run bounded and gameplay regressions
        id: regressions
        continue-on-error: true
        run: python3 tools/test_handoff_regression.py
      - name: Print regression evidence
        if: always()
        run: cat reports/handoff-regression.json
      - name: Persist generated QA output on scratch branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist reports
          if ! git diff --cached --quiet; then
            git commit -m "chore(crpg): refresh scratch build and QA reports [skip ci]"
            git push
          fi
      - name: Fail on regression
        if: always() && steps.regressions.outcome != 'success'
        run: exit 1
