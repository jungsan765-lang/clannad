name: CRPG v0.13.24 debt comparison

on:
  push:
    branches:
      - qa/crpg-v01324-baseline

jobs:
  compare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genshin-crpg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Build v0.13.24
        run: python3 tools/build.py
      - name: Run v0.13.24 bounded suite
        continue-on-error: true
        run: python3 tools/test_all.py
      - name: Print v0.13.24 evidence
        if: always()
        run: cat reports/suite-results.json
